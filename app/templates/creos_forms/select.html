{% extends "base.html" %}
{% block content %}
<h1>Create Creos Annexe 2 Forms</h1>

<form method="POST" action="{{ url_for('generate_creos_forms') }}" id="creosForm">
    
    <div class="mb-3">
        <label class="form-label">Select Sharing Group</label>
        <select name="sharing_group" class="form-select" id="sharingGroupSelect" required>
            <option value="">-- Select a sharing group --</option>
            {% for sg in sharing_groups %}
            <option value="{{ sg.sgID }}" data-name="{{ sg.sgName }}" data-number="{{ sg.sgNumber }}">
                {{ sg.sgName }} ({{ sg.sgNumber }})
            </option>
            {% endfor %}
        </select>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Representative Name</label>
        <input type="text" name="representative_name" class="form-control" placeholder="e.g. Durbach Marc" required>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Application Date</label>
        <input type="text" name="date_application" class="form-control" value="Dès que possible" placeholder="Dès que possible or dd/mm/yyyy">
    </div>
    
    <hr>
    <h3>Select PODs</h3>
    <p class="text-muted">Select the PODs to include in the forms. Green = available, Orange = already in this group, Gray = in another group.</p>
    
    <div id="podsContainer">
        <p>Please select a sharing group first.</p>
    </div>
    
    <div class="mt-4">
        <button type="submit" class="btn btn-primary">Generate Forms</button>
        <a href="{{ url_for('list_members') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>

<script>
// Store all PODs data
const allPods = {{ pods_json | safe }};
const sharingGroups = {{ sharing_groups_json | safe }};

document.getElementById('sharingGroupSelect').addEventListener('change', function() {
    const sgId = this.value;
    const container = document.getElementById('podsContainer');
    
    if (!sgId) {
        container.innerHTML = '<p>Please select a sharing group first.</p>';
        return;
    }
    
    const selectedSg = sharingGroups.find(sg => sg.sgID == sgId);
    
    // Get PODs already in this sharing group
    const podsInGroup = allPods.filter(pod => 
        pod.sharing_groups && pod.sharing_groups.some(g => g.sharingGroupID == sgId)
    );
    
    // Get PODs in other sharing groups
    const podsInOtherGroups = allPods.filter(pod => 
        pod.sharing_groups && pod.sharing_groups.length > 0 &&
        pod.sharing_groups.every(g => g.sharingGroupID != sgId)
    );
    
    // Get available PODs (not in any group)
    const availablePods = allPods.filter(pod => 
        !pod.sharing_groups || pod.sharing_groups.length === 0
    );
    
    let html = '<div class="table-responsive"><table class="table table-striped">';
    html += '<thead><tr><th><input type="checkbox" id="selectAll"></th><th>Member</th><th>Pod Label</th><th>Type</th><th>Pod Number</th><th>Peak Power</th><th>Battery</th><th>Status</th></tr></thead><tbody>';
    
    // Show available PODs first
    availablePods.forEach(pod => {
        html += renderPodRow(pod, 'available');
    });
    
    // Show PODs already in this group
    podsInGroup.forEach(pod => {
        html += renderPodRow(pod, 'in_group', true);
    });
    
    html += '</tbody></table></div>';
    
    container.innerHTML = html;
    
    // Select all checkbox
    document.getElementById('selectAll').addEventListener('change', function() {
        document.querySelectorAll('.pod-checkbox').forEach(cb => {
            if (!cb.disabled) cb.checked = this.checked;
        });
    });
});

function renderPodRow(pod, status, checked=false) {
    const statusClass = status === 'available' ? 'text-success' : 'text-warning';
    const statusText = status === 'available' ? 'Available' : 'Already in group';
    const disabled = status === 'in_other' ? 'disabled' : '';
    
    return `
        <tr>
            <td><input type="checkbox" name="pod_ids" value="${pod.podsID}" class="pod-checkbox" ${checked ? 'checked' : ''} ${disabled}></td>
            <td>${pod.member_name || 'Unknown'}</td>
            <td>${pod.podlabel}</td>
            <td>${pod.podType}</td>
            <td>${pod.podNumber || '-'}</td>
            <td>${pod.energyproduction || '-'}</td>
            <td>${pod.energystorage || '-'}</td>
            <td class="${statusClass}">${statusText}</td>
        </tr>
    `;
}
</script>
{% endblock %}
